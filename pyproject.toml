[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-code-intelligence"
version = "1.0.0"
description = "Agentic Code Intelligence: Multi-Stage Code Retrieval and Execution-Guided Reranking Engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Adharsh Arvinth", email = "adharsharvinth2108@gmail.com"},
    {name = "Rahul J", email = "jrahulnaidu@gmail.com"},
    {name = "Sivamiruthula", email = "sivamiruthula3@gmail.com"}
]
keywords = [
    "code-retrieval",
    "agentic-ai",
    "code-intelligence",
    "mteb",
    "coir",
    "information-retrieval",
    "semantic-search"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "torch>=2.0.0",
    "sentence-transformers>=3.0.0",
    "transformers>=4.40.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "datasets>=2.19.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "rank-bm25>=0.2.4"
]

[project.urls]
Homepage = "https://github.com/Adharsh-Arvinth/agentic-code-intelligence"
Repository = "https://github.com/Adharsh-Arvinth/agentic-code-intelligence.git"

# High-accuracy configuration for competition submission
# Uses code-specialized embedding models for maximum AppsRetrieval performance
# NOTE: codefuse-ai/F2LLM-v2-160M achieves ~58.95% NDCG@10 on AppsRetrieval
# but requires bfloat16 support. Use gte-modernbert-base as fallback.

embedding_model: "codefuse-ai/F2LLM-v2-160M"
reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
semantic_top_k: 200
lexical_top_k: 200
fusion_top_k: 100
rerank_top_k: 50
final_top_k: 10
fusion_strategy: "rrf"
rrf_k: 60
semantic_weight: 0.7
lexical_weight: 0.3
batch_size: 16
device: "auto"
cache_dir: "data/cache"
index_dir: "data/indexes"
results_dir: "results"

# Lightweight CPU-friendly configuration
# Uses BGE-large with proper query instruction prefix
# Lower accuracy (~7.5% NDCG@10) but fast on CPU without GPU

embedding_model: "BAAI/bge-large-en-v1.5"
reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
semantic_top_k: 200
lexical_top_k: 200
fusion_top_k: 100
rerank_top_k: 50
final_top_k: 10
fusion_strategy: "rrf"
rrf_k: 60
semantic_weight: 0.7
lexical_weight: 0.3
batch_size: 64
device: "cpu"
cache_dir: "data/cache"
index_dir: "data/indexes"
results_dir: "results"
